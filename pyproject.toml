[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ladock"
version = "0.3.0"
description = "Molecular docking workstation — PySide6 desktop app and rule-based (non-LLM) CLI agent"
readme = "README.md"
requires-python = ">=3.10"
# See LICENSE: academic free use through 2029-12-31, all rights reserved.
# NOT an OSI-approved licence, so no "License :: OSI Approved" classifier.
license = { file = "LICENSE" }
authors = [{ name = "La Ode Aman", email = "laode_aman@ung.ac.id" }]
keywords = ["molecular docking", "cheminformatics", "autodock", "vina", "computational chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# One install gives you both front-ends, so the GUI stack is a hard dependency.
# The CLI itself imports nothing from this list eagerly — RDKit/Meeko are loaded
# lazily, only on the code paths that need them.
dependencies = [
    # The PySide6 metapackage pulls in PySide6-Addons, which is where
    # QtWebEngine (the embedded 3D viewer) lives — no extra needed.
    "PySide6>=6.5",
    "numpy>=1.24",
    "pandas>=2.0",
    # Ed25519 verification for licence keys. Verification only —
    # the private key is never distributed.
    "cryptography>=41",
    # Molecular preparation: fix/sanitize, add H, Gasteiger charges, 3D embed,
    # and 2D SMILES depiction.
    "rdkit>=2023.3",
    # Native, cross-platform receptor/ligand PDBQT preparation (replaces
    # MGLTools, so docking runs on native Windows/Linux/macOS without WSL).
    "meeko>=0.5",
    # meeko 0.7.1 declares NO dependencies at all, yet imports both of these
    # (scipy.spatial in molecule_pdbqt.py / receptor_pdbqt.py). Without them a
    # plain `pip install ladock` yields an unusable meeko and every receptor and
    # ligand preparation fails at import time. Verified by installing into a
    # clean venv, not assumed.
    "scipy>=1.10",
    "gemmi>=0.6",
    # pandas needs this to read the .xlsx/.xls ligand libraries the CLI accepts;
    # without it an Excel library fails at read time, not at install time.
    "openpyxl>=3.1",
]

[project.urls]
Homepage      = "https://github.com/laode-aman-ung/LADOCK"
Repository    = "https://github.com/laode-aman-ung/LADOCK"
"Bug Tracker" = "https://github.com/laode-aman-ung/LADOCK/issues"

[project.scripts]
ladock-cli = "ladock.cli.agent:main"
ladock-fetch-binaries = "ladock.binaries:main"

[project.gui-scripts]
# gui-scripts, not scripts: on Windows this gets a pythonw.exe launcher, so
# starting the GUI does not open a console window behind it.
ladock-desktop = "ladock.desktop.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ladock*"]
# bin/ holds the engine binaries; they are fetched by `ladock-fetch-binaries`
# after install, never shipped in the wheel.
exclude = ["ladock.bin*", "packaging*", "scripts*", "tools*", "website*", "HAKI*"]

[tool.setuptools.exclude-package-data]
# The comment above is only true if ADFRsuite is actually kept out. Without
# this, bin/**/* sweeps in all 373 MB of it and the wheel lands at ~260 MB,
# far over PyPI's 100 MB per-file limit.
"ladock" = ["bin/*/ADFRsuite-1.0/**"]

[tool.setuptools.package-data]
# The wheel published to PyPI carries no engines: ladock/bin/ is git-ignored,
# so a clean CI checkout has nothing for this glob to match and the wheel comes
# to about 0.5 MB. That is deliberate — an 89 MB wheel would sit against PyPI's
# 100 MB per-file limit with no room to grow.
#
# Engines arrive on first use instead: ensure_platform_binaries() downloads the
# archive for the running platform from the GitHub release, or `ladock-fetch-
# binaries` does it explicitly. A build made where bin/ is populated (a release
# machine) will bundle them, minus ADFRsuite.
"ladock.desktop.gui" = ["assets/*.html", "assets/*.js", "assets/*.css", "assets/*.ico", "assets/*.png"]
"ladock.desktop.config" = ["*.txt", "*.csv", "*.mol", "*.mol2", "*.pdb", "*.smi", "*.sdf", "*.uri", "model_example/*"]
