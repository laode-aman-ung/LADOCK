name: Build installers

# Produces the four LADOCK installers on real per-OS runners:
#   Windows  → .exe (native + hybrid, Inno Setup)
#   Linux    → .deb + .AppImage
#   macOS    → .dmg
# Trigger manually or on a version tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Binaries come from YOUR hosted archives (bin-<platform>.tar.gz), not upstream.
# Set these repo secrets (both optional — script defaults to https://ladock.ladeep.id/bin):
#   LADOCK_BIN_BASE_URL  base URL of your bin archives
#   LADOCK_BIN_TOKEN     bearer token if the storage is private
env:
  LADOCK_BIN_BASE_URL: ${{ secrets.LADOCK_BIN_BASE_URL }}
  LADOCK_BIN_TOKEN: ${{ secrets.LADOCK_BIN_TOKEN }}

jobs:
  # ── Windows: native + hybrid ────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    strategy:
      # One flaky download must not cancel a sibling that is already building.
      fail-fast: false
      matrix:
        variant: [windows, windows-hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch bundled binaries (native)
        run: python -m ladock.binaries windows
      - name: Fetch bundled binaries (Linux for hybrid)
        if: matrix.variant == 'windows-hybrid'
        run: python -m ladock.binaries linux
      - name: Install deps
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Stage + freeze
        run: python packaging/build_release.py ${{ matrix.variant }}
      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DVariant=${{ matrix.variant }} `
            "/DAppVersion=$(python -c 'import ladock; print(ladock.__version__)')" `
            "/DSourceDir=${{ github.workspace }}\build\dist-${{ matrix.variant }}\LADOCK" `
            packaging\windows\ladock.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ladock-${{ matrix.variant }}
          path: build/installers/*.exe

  # ── Linux: deb + AppImage ───────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch bundled binaries
        run: python -m ladock.binaries linux
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 fuse
          python -m pip install -r requirements.txt pyinstaller
          curl -L -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Stage + freeze
        run: python packaging/build_release.py linux
      - name: Build .deb + AppImage
        run: |
          bash packaging/linux/build_deb.sh build/dist-linux/LADOCK linux
          bash packaging/linux/build_appimage.sh build/dist-linux/LADOCK linux
      - uses: actions/upload-artifact@v4
        with:
          name: ladock-linux
          path: |
            build/installers/*.deb
            build/installers/*.AppImage

  # ── macOS: dmg ──────────────────────────────────────────────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch bundled binaries
        run: python -m ladock.binaries mac
      - name: Install deps
        run: |
          python -m pip install -r requirements.txt pyinstaller
          brew install create-dmg || true
      - name: Stage + freeze
        run: python packaging/build_release.py mac
      - name: Build .dmg
        # Block scalar, not a folded one: YAML joins plain multi-line scalars
        # with a space, which turned the trailing "\" into an escaped space and
        # made the shell look for a command named " bash" (exit 127).
        run: |
          if [ -d build/dist-mac/LADOCK.app ]; then
            bash packaging/macos/build_dmg.sh build/dist-mac/LADOCK.app
          else
            echo "No .app bundle found — PyInstaller BUNDLE step did not run." >&2
            ls -la build/dist-mac/ >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ladock-mac
          path: build/installers/*.dmg

  # ── Publish to your own download host / cloud storage ───────────────────
  # Uploads every built installer to the location the website links to
  # (docs.html → downloads/…). Configure two repository secrets:
  #   LADOCK_UPLOAD_REMOTE  e.g. "myremote:my-bucket/downloads"  (rclone remote)
  #   RCLONE_CONFIG_B64     base64 of your rclone.conf (S3 / Cloudflare R2 /
  #                         Backblaze B2 / SFTP / WebDAV / …)
  # Skips automatically if the secrets are absent.
  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Upload installers (rclone)
        env:
          RCLONE_REMOTE: ${{ secrets.LADOCK_UPLOAD_REMOTE }}
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        if: ${{ env.RCLONE_REMOTE != '' }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copy installers "$RCLONE_REMOTE" --progress
          echo "Uploaded to $RCLONE_REMOTE"
